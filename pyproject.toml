[project]
name = "cdl-gen"
version = "0.1.0"
description = "Generate ASC CDL color decisions from paired reference images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=10.0",
    "alive-progress>=3.3.0",
]

[project.scripts]
cdl-gen = "cdl_gen.__main__:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
